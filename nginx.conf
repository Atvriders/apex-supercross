server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Restore the standard MIME table, then add game-specific types.
    # (Without this, .js under /assets/ falls back to octet-stream and
    # browsers refuse to execute module scripts due to strict MIME checking.)
    types {
        include /etc/nginx/mime.types;
        model/gltf-binary glb;
        application/octet-stream bin;
    }
    default_type application/octet-stream;

    # GLB / bin / json / js assets (Vite emits the hashed JS under /assets/)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types application/javascript text/javascript application/json text/css image/svg+xml model/gltf-binary;
}
