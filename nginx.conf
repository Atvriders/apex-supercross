server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No types{} override here: the image's stock nginx.conf already includes
    # /etc/nginx/mime.types globally, so .js gets text/javascript (required
    # for module scripts) and GLB/BIN fall back to octet-stream, which is fine
    # for fetch-based loading.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types application/javascript text/javascript application/json text/css image/svg+xml;
}
